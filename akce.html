<!DOCTYPE html>
<html lang="cs">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>FG Coffee — Mobilní coffee bar</title>

  <meta
    name="description"
    content="Mobilní coffee bar pro svatby, firemní akce a oslavy. Výběrová káva, minimalistický coffee bar a kompletní servis."
  >

  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      font-family:'Inter',sans-serif;
      background:#f5f3ef;
      color:#111;
      line-height:1.7;
      -webkit-font-smoothing:antialiased;
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    img{
      display:block;
      width:100%;
    }

    .hero{
      min-height:100vh;
      background:
        linear-gradient(rgba(0,0,0,0.58), rgba(0,0,0,0.58)),
        url('foto_um_narodni.jpg');
      background-size:cover;
      background-position:center;
      display:flex;
      align-items:flex-end;
      padding:70px 24px;
      color:white;
    }

    .hero-content{
      max-width:820px;
      width:100%;
      margin:auto;
    }

    .hero-top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:70px;
    }

    .hero-logo{
      font-size:14px;
      letter-spacing:3px;
      text-transform:uppercase;
      opacity:0.9;
    }

    .hero h1{
      font-size:96px;
      line-height:0.95;
      letter-spacing:6px;
      margin-bottom:26px;
    }

    .hero p{
      font-size:24px;
      max-width:760px;
      opacity:0.9;
      margin-bottom:40px;
    }

    .hero-buttons{
      display:flex;
      gap:14px;
      flex-wrap:wrap;
    }

    .button{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:15px 28px;
      border-radius:999px;
      transition:0.25s ease;
      font-size:15px;
      font-weight:500;
      border:none;
      cursor:pointer;
      font-family:'Inter',sans-serif;
    }

    .button-light{
      background:white;
      color:black;
    }

    .button-glass{
      background:rgba(255,255,255,0.12);
      border:1px solid rgba(255,255,255,0.2);
      backdrop-filter:blur(10px);
      color:white;
    }

    .button:hover{
      transform:translateY(-2px);
      opacity:0.92;
    }

    .container{
      max-width:1180px;
      margin:auto;
      padding:120px 24px;
    }

    .section{
      margin-bottom:140px;
    }

    .section-label{
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:3px;
      color:#777;
      margin-bottom:28px;
    }

    .intro{
      font-size:42px;
      line-height:1.3;
      max-width:980px;
      font-weight:500;
    }

    .intro span{
      color:#777;
    }

    .services-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:24px;
    }

    .service-card{
      background:white;
      border-radius:36px;
      padding:42px;
      box-shadow:0 10px 30px rgba(0,0,0,0.04);
      transition:0.25s ease;
    }

    .service-card:hover{
      transform:translateY(-5px);
      box-shadow:0 18px 40px rgba(0,0,0,0.08);
    }

    .service-card h4{
      font-size:34px;
      margin-bottom:18px;
      line-height:1.1;
    }

    .service-card p{
      color:#666;
      font-size:18px;
      line-height:1.8;
    }

    .experience{
      display:grid;
      grid-template-columns:1.1fr 0.9fr;
      gap:28px;
      align-items:center;
    }

    .experience-image img{
      height:700px;
      object-fit:cover;
      border-radius:40px;
    }

    .experience-content{
      background:white;
      border-radius:40px;
      padding:50px;
      box-shadow:0 10px 30px rgba(0,0,0,0.04);
    }

    .experience-content h3{
      font-size:42px;
      line-height:1.1;
      margin-bottom:24px;
    }

    .experience-content p{
      color:#666;
      font-size:17px;
      margin-bottom:18px;
    }

    .steps{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:20px;
    }

    .step{
      background:white;
      border-radius:30px;
      padding:34px;
      box-shadow:0 10px 30px rgba(0,0,0,0.04);
    }

    .step-number{
      font-size:11px;
      letter-spacing:2px;
      text-transform:uppercase;
      color:#888;
      margin-bottom:16px;
    }

    .step-title{
      font-size:26px;
      line-height:1.2;
      margin-bottom:14px;
      font-weight:600;
    }

    .step-text{
      color:#666;
      font-size:15px;
      line-height:1.8;
    }

    .gallery-grid{
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:18px;
    }

    .gallery-grid img{
      height:520px;
      object-fit:cover;
      border-radius:34px;
      transition:0.3s ease;
    }

    .gallery-grid img:hover{
      transform:scale(1.02);
    }

    .contact-box{
      background:#111;
      color:white;
      border-radius:42px;
      padding:70px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:60px;
    }

    .contact-box h3{
      font-size:54px;
      line-height:1.05;
      margin-bottom:22px;
    }

    .contact-box p{
      font-size:18px;
      color:rgba(255,255,255,0.72);
      max-width:520px;
    }

    .contact-links{
      margin-top:34px;
      display:flex;
      flex-direction:column;
      gap:16px;
    }

    .contact-links a{
      font-size:28px;
      font-weight:600;
      transition:0.2s ease;
    }

    .contact-links a:hover{
      opacity:0.7;
    }

    .form-card{
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:32px;
      padding:30px;
      backdrop-filter:blur(14px);
    }

    .form-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
      margin-bottom:14px;
    }

    .form-group{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .form-group.full{
      grid-column:1/-1;
    }

    .form-group label{
      font-size:13px;
      color:rgba(255,255,255,0.72);
    }

    input,
    select,
    textarea{
      width:100%;
      max-width:100%;
      -webkit-appearance:none;
      appearance:none;
      border:none;
      background:white;
      color:#111;
      border-radius:18px;
      padding:18px 20px;
      font-family:'Inter',sans-serif;
      font-size:15px;
      outline:none;
    }

    input[type="date"]{
      min-height:60px;
    }

    textarea{
      min-height:170px;
      resize:vertical;
    }

    .gdpr{
      display:flex;
      gap:12px;
      align-items:flex-start;
      margin:24px 0 30px;
      font-size:14px;
      color:rgba(255,255,255,0.72);
    }

    .gdpr input{
      width:16px;
      height:16px;
      min-width:16px;
      margin-top:3px;
      accent-color:white;
    }

    .gdpr a{
      text-decoration:underline;
    }

    footer{
      text-align:center;
      padding:60px 20px;
      color:#777;
      font-size:14px;
    }

    @media (max-width:1000px){

      .steps{
        grid-template-columns:1fr 1fr;
      }

      .experience{
        grid-template-columns:1fr;
      }

      .contact-box{
        grid-template-columns:1fr;
      }

    }

    @media (max-width:768px){

      .hero{
        min-height:auto;
        padding:40px 20px 70px;
      }

      .hero-top{
        margin-bottom:90px;
      }

      .hero h1{
        font-size:54px;
        letter-spacing:3px;
      }

      .hero p{
        font-size:19px;
        line-height:1.7;
      }

      .intro{
        font-size:28px;
      }

      .services-grid{
        grid-template-columns:1fr;
      }

      .service-card{
        padding:30px;
        border-radius:28px;
      }

      .service-card h4{
        font-size:28px;
      }

      .service-card p{
        font-size:16px;
      }

      .experience-image img{
        height:380px;
        border-radius:28px;
      }

      .experience-content{
        padding:30px;
        border-radius:28px;
      }

      .experience-content h3{
        font-size:30px;
      }

      .steps{
        grid-template-columns:1fr;
      }

      .gallery-grid{
        grid-template-columns:1fr;
      }

      .gallery-grid img{
        height:320px;
        border-radius:24px;
      }

      .contact-box{
        padding:34px 24px;
        border-radius:28px;
        gap:40px;
      }

      .contact-box h3{
        font-size:36px;
      }

      .contact-links a{
        font-size:22px;
        word-break:break-word;
      }

      .form-card{
        padding:20px;
        border-radius:24px;
      }

      .form-grid{
        grid-template-columns:1fr;
      }

      .gdpr{
        font-size:13px;
        line-height:1.6;
      }

    }

  </style>

</head>

<body>

  <!-- ZBYTEK HTML ZŮSTÁVÁ STEJNÝ -->
  <!-- sem vlož svůj obsah stránky -->

</body>
</html>
